{% extends "base.html" %} {% block title %}Login{% endblock title %} {% block
content %}



<h1 class="text-center ">FaceLog Admin</h1>
<div class="container d-flex justify-content-center mt-5">
    <div class="col-md-10 col-lg-4 border rounded p-4 shadow-sm">

        <form method="POST" >
            <h3 class="text-center mb-4">Admin Login</h3>

            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="fullname" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" name="email" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>

           

            <!-- Submit Button -->
            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
            </div>
            <p class="text-center mt-3">New User Create <a href="/admin_registration">New Admin</a></p>
        </form>

    </div>
</div>

{% endblock content %}
